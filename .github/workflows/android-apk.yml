
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-apk.yml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Install dependencies
        run: npm ci

      - name: Initialize Tauri Android project
        run: npm run tauri android init

      - name: Diagnose TLS dependencies
        shell: bash
        run: |
          echo "Checking Android dependency tree..."
          cargo tree --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android | grep -E 'openssl|native-tls|hyper-tls|reqwest' || true

      - name: Build APK
        run: npm run tauri android build -- --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: autoshorts-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
